name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Test the pure-Java logic (no Minecraft needed)
        run: |
          mkdir -p /tmp/t
          javac -d /tmp/t src/main/java/dev/cobblemonmbti/MbtiKeys.java src/main/java/dev/cobblemonmbti/MbtiTable.java \
                src/main/java/dev/cobblemonmbti/MbtiColors.java src/main/java/dev/cobblemonmbti/MbtiLayout.java tools/ResolverSelfTest.java
          java -cp /tmp/t ResolverSelfTest
      - name: Build the mod
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: cobblemon-mbti
          path: build/libs/*.jar

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cobblemon-mbti
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
